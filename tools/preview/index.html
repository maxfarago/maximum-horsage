<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>preview — max.horse</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e8dcc4;
        color: #1a1612;
        font: 13px/1.35 ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header,
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        align-items: center;
        padding: 0.6rem 0.8rem;
        border-color: #c4b496;
        border-style: solid;
        border-width: 0;
      }
      header {
        border-bottom-width: 1px;
      }
      footer {
        border-top-width: 1px;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      button,
      input[type="range"] {
        font: inherit;
      }
      button {
        background: #1a1612;
        color: #e8dcc4;
        border: 0;
        padding: 0.25rem 0.7rem;
      }
      #loop {
        color: #6b2a1a;
      }
    </style>
  </head>
  <body>
    <header>
      <label>load annotations <input id="file" type="file" accept="application/json" /></label>
      <button type="button" id="demo">synthetic demo</button>
      <button type="button" id="save">download rig.json</button>
      <span id="loop"></span>
    </header>
    <canvas id="stage"></canvas>
    <footer>
      <input id="scrub" type="range" min="0" max="14" value="0" />
      <span id="frame">frame 0</span>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
