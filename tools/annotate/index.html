<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>annotate — max.horse</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <label>plate <input id="plate" type="text" value="placeholder" spellcheck="false" /></label>
      <label>cols <input id="cols" type="number" min="1" value="4" /></label>
      <label>rows <input id="rows" type="number" min="1" value="3" /></label>
      <label>crop l <input id="crop-l" type="number" min="0" value="0" /></label>
      <label>t <input id="crop-t" type="number" min="0" value="0" /></label>
      <label>r <input id="crop-r" type="number" min="0" value="0" /></label>
      <label>b <input id="crop-b" type="number" min="0" value="0" /></label>
      <label class="file">load image <input id="file" type="file" accept="image/*" /></label>
      <label class="file">load json <input id="json" type="file" accept="application/json" /></label>
      <button type="button" id="export">export</button>
    </header>

    <div class="status">
      <div id="current-name">root</div>
      <div id="current-meta">0 / 23 · frame 0 / 12</div>
    </div>

    <div class="work">
      <ol id="joints"></ol>
      <canvas id="stage"></canvas>
      <aside>
        <p>click place</p>
        <p>backspace undo</p>
        <p>s skip</p>
        <p>← → frame</p>
        <p>wheel zoom</p>
        <p>space-drag pan</p>
        <p>0 reset view</p>
        <p class="warn">placeholder plate. do not trace a real cycle until provenance is filled in.</p>
      </aside>
    </div>

    <nav id="strip"></nav>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
